<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Découvrez les favoris et les commandes du lecteur de Free TV Zen en images.">
<title>Free TV Zen — Galerie</title>
<style>
:root{color-scheme:dark;background:#0b120c;color:#ecf5e2}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 20px 60px}header{text-align:center;margin-bottom:32px}header img{width:100px;height:100px;border-radius:20px}h1{color:#ccf97c;margin:14px 0}a{color:#ccf97c}header p{color:#c1cbbb}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.thumbnail{display:block;background:#151e15;border:1px solid #465c32;border-radius:14px;overflow:hidden;text-decoration:none}.thumbnail:hover,.thumbnail:focus-visible{outline:2px solid #ccf97c;outline-offset:3px}.thumbnail img{width:100%;height:auto;display:block}.thumbnail span{display:block;padding:14px}dialog{position:fixed;inset:0;width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:#080d08;color:#fff}dialog::backdrop{background:#080d08}.viewer{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:12px;gap:12px}.tools{display:flex;justify-content:space-between;align-items:center;gap:12px}.stage{min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:12px;align-items:center}.stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;margin:auto;object-fit:contain;min-width:0;min-height:0}.stage figure{margin:0;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}.caption{text-align:center;margin:0;color:#ccf97c}button{background:#1a2b18;color:#e9f7da;border:1px solid #829f5a;border-radius:24px;min-height:44px;padding:8px 16px;cursor:pointer;font:inherit}button:hover,button:focus-visible{background:#ccf97c;color:#13200d}.arrow{width:48px;font-size:28px;padding:0}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}.hint{font-size:.9em;color:#b2bbaa}body.viewer-open{overflow:hidden}@media(max-width:640px){.gallery{grid-template-columns:1fr}.viewer{padding:8px;gap:8px}.stage{grid-template-columns:40px minmax(0,1fr) 40px;gap:4px}.arrow{width:40px}.hint{display:none}}
</style>
</head>
<body>
<main>
<header>
<img src="https://github.com/user-attachments/assets/d3798e8a-4204-4c5d-a799-f91004ae7224" alt="Logo Free TV Zen" width="100" height="100">
<h1>Free TV Zen</h1>
<p>Cliquez sur une miniature pour parcourir les captures en grand.</p>
<a href="https://github.com/athor/Free-TV-Zen">Retour au projet GitHub</a>
</header>
<div class="gallery" aria-label="Captures de Free TV Zen">
<a class="thumbnail" href="https://github.com/user-attachments/assets/02e59db1-aca4-4ccd-a144-6b18847577d3" data-index="0"><img src="https://github.com/user-attachments/assets/02e59db1-aca4-4ccd-a144-6b18847577d3" alt="Favoris — vue liste" loading="lazy" width="3840" height="1911"><span>Favoris — vue liste</span></a>
<a class="thumbnail" href="https://github.com/user-attachments/assets/bb5e75df-0221-48e5-b13e-1ec6f5e065ea" data-index="1"><img src="https://github.com/user-attachments/assets/bb5e75df-0221-48e5-b13e-1ec6f5e065ea" alt="Favoris — vue compacte" loading="lazy" width="3840" height="1911"><span>Favoris — vue compacte</span></a>
<a class="thumbnail" href="https://github.com/user-attachments/assets/cedeb8be-6cba-44df-ad07-84e062989e46" data-index="2"><img src="https://github.com/user-attachments/assets/cedeb8be-6cba-44df-ad07-84e062989e46" alt="Favoris — vue standard" loading="lazy" width="3840" height="1911"><span>Favoris — vue standard</span></a>
<a class="thumbnail" href="https://github.com/user-attachments/assets/bf4afda5-6e42-474a-958b-feb9bc8737c3" data-index="3"><img src="https://github.com/user-attachments/assets/bf4afda5-6e42-474a-958b-feb9bc8737c3" alt="Lecteur — aperçu 3" loading="lazy" width="3840" height="1911"><span>Lecteur — aperçu 3</span></a>
<a class="thumbnail" href="https://github.com/user-attachments/assets/aa9dd3f2-b4f8-4563-a596-20769131a5c3" data-index="4"><img src="https://github.com/user-attachments/assets/aa9dd3f2-b4f8-4563-a596-20769131a5c3" alt="Lecteur — aperçu 2" loading="lazy" width="3840" height="1911"><span>Lecteur — aperçu 2</span></a>
<a class="thumbnail" href="https://github.com/user-attachments/assets/128140be-6b76-49a0-b043-99a114d3a755" data-index="5"><img src="https://github.com/user-attachments/assets/128140be-6b76-49a0-b043-99a114d3a755" alt="Lecteur — aperçu 1" loading="lazy" width="3840" height="1911"><span>Lecteur — aperçu 1</span></a>
</div>
</main>
<dialog aria-label="Galerie de captures" id="lightbox">
<div class="viewer">
<div class="tools"><a id="original" href="#" target="_blank" rel="noopener">Image originale</a><span class="hint">Flèches ← → pour naviguer · Échap pour fermer</span><button id="close" type="button" autofocus>Fermer ✕</button></div>
<div class="stage"><button id="previous" class="arrow" type="button" aria-label="Image précédente">‹</button><figure><img id="full" alt=""></figure><button id="next" class="arrow" type="button" aria-label="Image suivante">›</button></div>
<p id="caption" class="caption" aria-live="polite" aria-atomic="true"></p>
</div>
</dialog>
<script>
'use strict';
const cards=Array.from(document.querySelectorAll('.thumbnail'));
const dialog=document.querySelector('#lightbox');
const full=document.querySelector('#full');
const caption=document.querySelector('#caption');
const original=document.querySelector('#original');
let current=0;
let trigger=null;
function show(index){
 current=(index+cards.length)%cards.length;
 const card=cards[current];
 full.src=card.href;
 full.alt=card.querySelector('img').alt;
 caption.textContent=`${current+1} / ${cards.length} — ${full.alt}`;
 original.href=card.href;
 history.replaceState(null,'',`#image-${current+1}`);
}
function open(index,source){
 trigger=source||cards[index];
 show(index);
 if(!dialog.open){dialog.showModal();document.body.classList.add('viewer-open');}
}
cards.forEach((card,index)=>card.addEventListener('click',event=>{
 if(event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||typeof dialog.showModal!=='function')return;
 event.preventDefault();open(index,card);
}));
document.querySelector('#previous').addEventListener('click',()=>show(current-1));
document.querySelector('#next').addEventListener('click',()=>show(current+1));
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey)return;
 if(event.key==='ArrowLeft'){event.preventDefault();show(current-1);}
 if(event.key==='ArrowRight'){event.preventDefault();show(current+1);}
});
dialog.addEventListener('close',()=>{
 document.body.classList.remove('viewer-open');
 history.replaceState(null,'',location.pathname+location.search);
 if(trigger)trigger.focus();
});
function followHash(){
 const match=/^#image-([1-6])$/.exec(location.hash);
 if(match&&typeof dialog.showModal==='function')open(Number(match[1])-1);
 else if(dialog.open)dialog.close();
}
window.addEventListener('hashchange',followHash);
followHash();
</script>
</body>
</html>
